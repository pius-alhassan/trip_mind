name: Python CI

on: [push, pull_request]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests with pytest (non-blocking)
        run: |
          echo "Running tests with pytest (non-blocking)..."
          pytest || echo "⚠️ Some tests failed, please review results above but not blocking merge."

  lint:
    name: Code Quality Check (Linting)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install linting tools
        run: |
          pip install flake8

      - name: Run flake8 (warnings only)
        run: |
          echo "🔍 Running flake8 for code style checks (warnings only, not blocking)..."
          flake8 src tests || echo "⚠️ Lint warnings detected - please fix when convenient."
